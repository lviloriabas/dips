 local: 30 min 18 s</title></circle><text x="592.1" y="112.0" class="ink" font-size="13" text-anchor="end" font-weight="600">30 min 18 s</text><text x="16.0" y="180.0" class="muted" font-size="11" text-anchor="start" font-weight="400">Escala logarítmica. Mismo equipo (Ryzen 5 3600, sin GPU).</text><text x="16.0" y="196.0" class="muted" font-size="11" text-anchor="start" font-weight="400">Con modelo incluye la carga del modelo en memoria (8.4 s).</text></svg>