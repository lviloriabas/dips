<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 206" role="img" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' class="viz"><title>Tiempo para auditar los 915 DIPs</title><desc>Sin modelo 2.4 s; con modelo en CPU 30 min 18 s. Escala logarítmica.</desc><style>
.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}
.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.s1{fill:#2a78d6}.s2{fill:#eb6834}
.s1soft{fill:#b7d3f6}.ring{stroke:#fcfcfb}.gap{stroke:#fcfcfb}
.ok{fill:#0ca30c}.rev{fill:#fab219}.nc{fill:#ec835a}.cr{fill:#d03b3b}
.on-dark{fill:#ffffff}.on-light{fill:#0b0b0b}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.grid{stroke:#2c2c2a}.axis{stroke:#383835}
