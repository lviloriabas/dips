<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" role="img" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' class="viz"><title>Discrepancias del auditor según su comentario</title><desc>Cuántas marca el programa desde el Excel y dónde está el dato que falta.</desc><style>
