- id: AMORTIGUADOR_NLG
  nombre: NOSE LANDING GEAR SHOCK STRUT
  referencias: ["NOSE LANDING GEAR SHOCK STRUT"]
  requiere: [[NLG, NOSE LANDING GEAR, NOSE GEAR], [STRUT]]
  excluir: [SWIVEL]   # fuga en el swivel del NLG no es servicio del amortiguador
  intervalos: &intervalos_amortiguador
    - variante: "NG: 20 FC (AFTER 5 LANDINGS, NOT LATER THAN 20 LANDINGS)"
      flotas: [NG, NG-700, NG-800, NG-900]
      limites: [{valor: 20, unidad: FC}]
    - variante: "MAX: 10 FC (FIVE TO TEN IN-SERVICE LANDINGS AFTER A COMPLETE OIL AND NITROGEN SERVICING)"
      flotas: [MAX]
      limites: [{valor: 10, unidad: FC}]

