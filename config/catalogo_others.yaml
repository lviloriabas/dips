# Catálogo de tipos de DIP "Others".
#
# Cada entrada asocia un Fault Name (por palabras clave) con una o más filas de
# "DIPs References.xlsx" (columna DESCRIPTION, texto exacto).
#
#   requiere:   lista de grupos; el Fault Name debe contener AL MENOS UNA frase
#               de CADA grupo. Mientras más grupos, más específica la entrada.
#   excluir:    si el Fault Name contiene alguna de estas frases, no aplica.
#   intervalos: (opcional) reemplaza el TA de la tabla cuando el texto de la
#               tabla es condicional (por flota, por presión, etc.).
#               Unidades: DAY, FH, FC, MONTH.
#   requiere_sn: el Fault Name debería mencionar el S/N del componente.
#
# Las frases se escriben en MAYÚSCULAS y sin acentos. Antes de comparar, el
# texto se normaliza (ver dips_audit/texto.py: sinónimos y errores comunes como
# FIRT -> FIRST, OXIGEN -> OXYGEN, CERTIFICADO -> CERTIFICATE).

- id: OXIGENO_TRIPULACION
  nombre: Botella de oxígeno de tripulación (presión baja)
  referencias: ["CREW OXYGEN BOTTLE PRESSURE"]
  requiere: [[OXYGEN], [CREW, FLIGHT COMPARTMENT, FLIGHT DECK, COCKPIT]]
  excluir: [PORTABLE, HYDRO, POB, MASK, MASKS]
  intervalos:
    - variante: "Presión > 200 PSI sobre la mínima de despacho"
      limites: [{valor: 3, unidad: DAY}]
    - variante: "Presión 100-200 PSI sobre la mínima de despacho"
      limites: [{valor: 1, unidad: DAY}]
    - variante: "Presión 50-100 PSI sobre la mínima de despacho"
      limites: [{valor: 1, unidad: FC}]

- id: OXIGENO_HYDRO
  nombre: Fecha de prueba hidrostática de botella de oxígeno
  referencias: ["OXYGEN BOTTLE HYDRO DATE"]
  requiere: [[OXYGEN], [HYDRO]]
  requiere_sn: true

- id: OXIGENO_PORTATIL
  nombre: Botella portátil de oxígeno (POB)
  referencias: ["CABIN PORTABLE OXYGEN BOTTLE (POB)"]
  requiere: [[PORTABLE OXYGEN, POB]]
  requiere_sn: true

- id: ELT_PORTATIL
  nombre: ELT portátil (emergency locator transmitter)
  referencias: ["PORTABLE ELT BATTERY"]
  requiere: [[ELT, EMERGENCY LOCATOR]]
  excluir: [FIXED]
  requiere_sn: true

- id: ELT_FIJO
  nombre: ELT fijo
  referencias: ["FIXED ELT BATTERY"]
  requiere: [[ELT, EMERGENCY LOCATOR], [FIXED]]
  requiere_sn: true

- id: EMK
  nombre: Emergency Medical Kit (kit médico de emergencia)
  referencias: ["EMK LESS THAN 130 DAYS DUE DATE"]
  requiere: [[EMK, EMERGENCY MEDICAL KIT]]
  requiere_sn: true

- id: FAK
  nombre: First Aid Kit (botiquín de primeros auxilios)
  referencias: ["FIRST AID KIT LESS THAN 130 DAYS DUE DATE"]
  requiere: [[FAK, FIRST AID KIT]]
  requiere_sn: true

- id: UPK
  nombre: Universal Precaution Kit (kit de protección universal)
  referencias: ["UPK LESS THAN 130 DAYS DUE DATE"]
  requiere: [[UPK, UNIVERSAL PROTECTION KIT, UNIVERSAL PRECAUTION KIT]]
  requiere_sn: true

- id: SURVIVAL_KIT
  nombre: Survival Kit (kit de supervivencia)
  referencias: ["SURVIVAL KIT LESS THAN 130 DAYS DUE DATE"]
  requiere: [[SURVIVAL KIT]]
  requiere_sn: true

- id: FDR
  nombre: FDR Report (flight data recorder)
  referencias: ["FDR REPORT"]
  requiere: [[FDR]]
  excluir: [UNDERWATER, ULB, BEACON]

- id: HALON_PORTATIL
  nombre: Extintor de halón (portátil, cabina, etc.)
  referencias: ["HALON FIRE EXTINGUISHER DUE OR WEIGHT (PORTABLE, CABIN, ETC)"]
  requiere: [[HALON, EXTINGUISHER]]
  excluir: [WATER, SQUIB, CARGO, APU, ENGINE]
  requiere_sn: true

- id: EXTINTOR_AGUA
  nombre: Extintor portátil de agua
  referencias: ["PORTABLE WATER FE LESS THAN 130 DAYS WEIGHT CHECK"]
  requiere: [[WATER], [EXTINGUISHER, FE]]
  requiere_sn: true

- id: SQUIB_MOTOR_APU
  nombre: Squib de extintor de motor/APU
  referencias: ["ENGINE/APU FIRE EXTINGUIHSER SQUIB DUE IN 4 MONTHS OR LESS"]
  requiere: [[SQUIB], [ENGINE, APU]]

- id: SQUIB
  nombre: Squibs de extintor
  referencias: ["FIRE EXTINGUISHER SQUIBS"]
  requiere: [[SQUIB]]

- id: EXTINTOR_CARGO
  nombre: Botella de extintor de carga
  referencias: ["CARGO FIRE EXT. BOTTLE"]
  requiere: [[CARGO], [EXTINGUISHER, FIRE BOTTLE]]

- id: CRECIMIENTO_MICROBIANO
  nombre: Inspección de crecimiento microbiano en combustible
  referencias: ["FUEL MICROBIAL GROWTH"]
  requiere: [[MICROBIAL, MICROBMONITOR]]

- id: FILTRO_COMBUSTIBLE_MOTOR
  nombre: Filtro de combustible de motor
  referencias: ["ENGINE FUEL FILTER"]
  requiere: [[FUEL FILTER]]

- id: FUMIGACION
  nombre: Certificado de fumigación
  referencias: ["CERTIFICATE OF FUMIGATION"]
  requiere: [[FUMIGATION]]

- id: LICENCIA_RADIO
  nombre: Licencia de radio
  referencias: ["RADIO LICENSE"]
  requiere: [[RADIO LICENSE]]

- id: DESCONTAMINACION_HID_INICIAL
  nombre: Descontaminación hidráulica inicial
  referencias: ["HYDRAULIC DECONTAMINATION - INITIAL"]
  requiere: [[HYDRAULIC DECONTAMINATION], [INITIAL]]

- id: DESCONTAMINACION_HID_TERMINAL
  nombre: Descontaminación hidráulica terminal
  referencias: ["HYDRAULIC DECONTAMINATION - TERMINAL"]
  requiere: [[HYDRAULIC DECONTAMINATION], [TERMINAL]]

- id: BACKFLOW
  nombre: Primary backflow prevention check valve
  referencias: ["PRIMARY BACKFLOW PREVENTION CHECK VALVE"]
  requiere: [[BACKFLOW]]

- id: DPI
  nombre: Differential pressure indicator
  referencias: ["DIFFERENTIAL PRESSURE INDICATOR"]
  requiere: [[DIFFERENTIAL PRESSURE INDICATOR, DPI]]

- id: AMORTIGUADOR_NLG
  nombre: Amortiguador del tren de nariz
  referencias: ["NOSE LANDING GEAR SHOCK STRUT"]
  requiere: [[NLG, NOSE LANDING GEAR, NOSE GEAR], [STRUT]]
  excluir: [SWIVEL]   # fuga en el swivel del NLG no es servicio del amortiguador
  intervalos: &intervalos_amortiguador
    - variante: "NG: después de 5 aterrizajes, no más de 20"
      flotas: [NG-700, NG-800, NG-900]
      limites: [{valor: 20, unidad: FC}]
    - variante: "MAX: 5 a 10 aterrizajes después de servicio completo"
      flotas: [MAX]
      limites: [{valor: 10, unidad: FC}]

- id: AMORTIGUADOR_MLG
  nombre: Amortiguador del tren principal
  referencias: ["MAIN LANDING GEAR SHOCK STRUT"]
  requiere: [[MLG, MAIN LANDING GEAR, MAIN GEAR], [STRUT]]
  intervalos: *intervalos_amortiguador

- id: AMORTIGUADOR_GENERICO
  nombre: Amortiguador (tren no especificado)
  referencias: ["MAIN LANDING GEAR SHOCK STRUT", "NOSE LANDING GEAR SHOCK STRUT"]
  requiere: [[SHOCK STRUT]]
  excluir: [SWIVEL]
  intervalos: *intervalos_amortiguador

- id: DESGASTE_FRENOS
  nombre: Desgaste de frenos (brake wear pin)
  referencias: ["CARBON BREAK WEAR PIN LENGTH UNDER 1/16\""]
  requiere: [[BRAKE]]
  excluir: [PARKING BRAKE]
  intervalos:
    - variante: "737NG-700: después de 27 FC, antes de 37 FC"
      flotas: [NG-700]
      limites: [{valor: 37, unidad: FC}]
    - variante: "737NG-800: después de 12 FC, antes de 20 FC"
      flotas: [NG-800, NG-900]
      limites: [{valor: 20, unidad: FC}]
    - variante: "737NG-800 con wear pin < 1/32\" en overnight check: 5 FC"
      flotas: [NG-800, NG-900]
      limites: [{valor: 5, unidad: FC}]
    - variante: "B737MAX-8/9: después de 34 FC, antes de 42 FC"
      flotas: [MAX]
      limites: [{valor: 42, unidad: FC}]

- id: FRENO_PARQUEO
  nombre: Freno de parqueo (FNC FAIL / hold check)
  referencias:
    - "PARKING BREAK SYSTEM FNC FAIL / HOLD CHECK [1]"
    - "PARKING BREAK SYSTEM FNC FAIL / HOLD CHECK [2]"
  requiere: [[PARKING BRAKE]]

- id: CABLES_ALERON
  nombre: Re-tensión de cables de alerón
  referencias:
    - "AILERON WING CABLE RE-TENSION CHECK (AJUSTED)"
    - "AILERON WING CABLE RE-TENSION CHECK (NEW CABLE)"
  requiere: [[AILERON, ABSA, ABSB], [CABLE, CABLES, RETENSION, TENSION]]

- id: CABLES_TIMON
  nombre: Re-tensión de cables de timón
  referencias:
    - "RUDDER CONTROL CABLES RE-TENSION CHECK AND ADJUSTMENT (ADJUSTED)"
    - "RUDDER CONTROL CABLES RE-TENSION CHECK AND ADJUSTMENT (NEW CABLE)"
  requiere: [[RUDDER], [CABLE, CABLES]]

- id: CABLES_ELEVADOR
  nombre: Re-tensión de cables de elevador
  referencias: &ref_cables_elevador
    - "ELEVATOR/HORIZONTAL STABILIZER CONTROL CABLES RE-TENSION CHECK AND ADJUSTMENT (AJUSTED)"
    - "ELEVATOR/HORIZONTAL STABILIZER CONTROL CABLES RE-TENSION CHECK AND ADJUSTMENT (NEW CABLE)"
  requiere: [[ELEVATOR], [CABLE, CABLES]]

# Misma referencia que el elevador, pero son cables distintos (STA/STB): se
# separa para que no se marquen como duplicados entre sí.
- id: CABLES_ESTABILIZADOR
  nombre: Re-tensión de cables de estabilizador horizontal
  referencias: *ref_cables_elevador
  requiere: [[HORIZONTAL STABILIZER, STA STB, STABILIZER], [CABLE, CABLES]]

- id: LLANTA
  nombre: Llanta con segunda capa visible
