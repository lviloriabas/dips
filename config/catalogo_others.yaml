- id: DESGASTE_FRENOS
  nombre: CARBON BREAK WEAR PIN LENGTH UNDER 1/16"
  referencias: ["CARBON BREAK WEAR PIN LENGTH UNDER 1/16\""]
  requiere: [[BRAKE]]
  excluir: [PARKING BRAKE]
  intervalos:
    - variante: "737NG-700: AFTER 27 FC, BEFORE 37 FC"
      flotas: [NG-700]
      limites: [{valor: 37, unidad: FC}]
    - variante: "737NG-800: AFTER 12 FC, BEFORE 20 FC"
      flotas: [NG-800, NG-900]
      limites: [{valor: 20, unidad: FC}]
    - variante: "737NG-800: IF OVERNIGHT CHECK AT LESS THAN 1/32\": 5 FC"
      flotas: [NG-800, NG-900]
      limites: [{valor: 5, unidad: FC}]
    - variante: "B737MAX-9/8: AFTER 34 FC, BEFORE 42 FC"
      flotas: [MAX]
      limites: [{valor: 42, unidad: FC}]

