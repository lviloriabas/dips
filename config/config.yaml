# Configuración general del auditor de DIPs.
# Las rutas relativas se resuelven desde la carpeta del proyecto.

# Copia inicial para trabajar si SharePoint no está disponible. --referencias permite
# elegir otro XLSX/PDF o enlace. Los archivos descargados se conservan en data/.
referencias: "DIPs References.xlsx"
# Fuente preferida al auditar y al abrir Edge. Vacío = trabajar solo con la copia local.
referencias_sharepoint: "https://copaairlines.sharepoint.com/:x:/r/teams/VP_Tecnica/dacre/records/_layouts/15/doc2.aspx?sourcedoc=%7B71427FA7-2DB0-4851-A5BA-63F30401684E%7D&file=DIPs%20References.xlsx&action=default&mobileredirect=true"
hoja_referencias: "References"
catalogo: "config/catalogo_others.yaml"
carpeta_salida: "salidas"
# Corridas de prueba: un Excel dentro de esta carpeta (o con --prueba) usa pruebas/icam.json y
# pruebas/salidas, y sus resultados llevan el prefijo PRUEBA_.
carpeta_pruebas: "pruebas"

# Tipos de DIP que se auditan (columna "Area" o "Type DIP" del Excel de entrada), p. ej.
# ["Others"]. Vacío = todos. Al ejecutar: --tipos-dip Others. Los demás quedan FUERA DE ALCANCE.
tipos_auditados: []

tolerancias:
  dias: 1          # diferencia aceptada en días (redondeos de hora de apertura)
  meses_min: 30    # 1 mes = entre 30 y 31 días (+/- tolerancia de días)
  meses_max: 31
  # Cierre: Complete Dt viene en UTC y el due date en hora de Panamá (UTC-5). Los auditores
  # aceptan cierres hasta 5 h después del due date (criterio a confirmar).
  horas_cierre: 5
  # Start de un T/A por uso: diferencia aceptada con el uso al encontrar la falla (ICAM,
  # "Usage When Found"). En días se usa la tolerancia de días.
  inicio_fh: 2
  inicio_fc: 0

# Tipos de discrepancia y reglas: cuáles se revisan y cuándo son críticas.
discrepancias: "config/discrepancias.yaml"

referencia_tecnica:
  # Manuales cuya cita no necesita REV ni fecha de la REV (TASK CARD = task card JIC).
  # Para exigirlas también en alguno, quítelo de la lista; [] = se exigen en todos.
  # Otros nombres posibles: FIM, IPC, SWPM, CMM, EC, ECRA, EA, SB, AD...
  # El MGM no es referencia técnica: citarlo no cuenta como referencia.
  revision_opcional: [AMM, SRM, TASK CARD]

icam:
  # Lectura de DIPs en ICAM por barcode, solo lectura (auditar/comparar --icam, extraer-icam, barcode).
  # Usa el Edge de ICAM del programa: se abre directo en ICAM y la sesión se inicia ahí.
  # Si no hay sesión, el programa avisa y sigue apenas el usuario la inicia; si la página
  # de inicio de sesión muestra un error (usuario o clave), se detiene de inmediato.
  url: "https://copa.ifs.cloud/maintenix/"
  perfil: ".icam_perfil"          # perfil del Edge de ICAM (no se sube al repositorio)
  puerto: 9222                    # puerto local por el que el programa usa ese Edge
  archivo: "data/icam.json"       # todos los DIPs leídos, juntos en un solo JSON
  paralelo: 3                     # DIPs que se leen a la vez
  vigencia_minutos: 60            # lo leído hace menos de esto no se vuelve a leer (--no-cache: leer todo)
  intentos: 3                     # reintentos por búsqueda o pestaña que falla
  espera_segundos: 30             # máximo por página
  espera_sesion_minutos: 3        # tope si nadie inicia sesión (el inicio y el error se detectan al instante)
  selector_error_sesion: ""       # vacío = mensajes de error de Keycloak (ICAM) y de Microsoft
  selector_busqueda: ""           # vacío = el campo Barcode Search se busca solo
  selector_contenido: "body"      # de dónde se copia el texto de cada pestaña
