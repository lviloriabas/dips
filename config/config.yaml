# Configuración general del auditor de DIPs.
# Las rutas relativas se resuelven desde la carpeta del proyecto.

referencias: "DIPs References.xlsx"
hoja_referencias: "References"
catalogo: "config/catalogo_others.yaml"
carpeta_salida: "salidas"
# Corridas de prueba: un Excel dentro de esta carpeta (o con --prueba) usa pruebas/icam y
# pruebas/salidas, y sus resultados llevan el prefijo PRUEBA_.
carpeta_pruebas: "pruebas"

# Tipo de DIP que se audita (columna "Area" o "Type DIP" del Excel de entrada).
tipos_auditados: ["Others"]

tolerancias:
  dias: 1          # diferencia aceptada en días (redondeos de hora de apertura)
  meses_min: 30    # 1 mes = entre 30 y 31 días (+/- tolerancia de días)
  meses_max: 31
  # Cierre: Complete Dt viene en UTC y el due date en hora de Panamá (UTC-5). Los auditores
  # aceptan cierres hasta 5 h después del due date (criterio a confirmar).
  horas_cierre: 5

# Tipos de discrepancia y reglas: cuáles se revisan y cuándo son críticas.
discrepancias: "config/discrepancias.yaml"

referencia_tecnica:
  # Manuales cuya cita no necesita REV ni fecha de la REV (TASK CARD = task card JIC).
  # Para exigirlas también en alguno, quítelo de la lista; [] = se exigen en todos.
  # Otros nombres posibles: FIM, IPC, SWPM, CMM, EC, ECRA, EA, SB, AD...
  # El MGM no es referencia técnica: citarlo no cuenta como referencia.
  revision_opcional: [AMM, SRM, TASK CARD]

icam:
  # Lectura de DIPs en ICAM por barcode, solo lectura (auditar --leer-icam, extraer-icam).
  # Usa el Edge de ICAM del programa: se abre directo en ICAM y la sesión se inicia ahí.
  # Si no hay sesión, el programa avisa y espera a que el usuario la inicie.
  url: "https://copa.ifs.cloud/maintenix/"
  perfil: ".icam_perfil"          # perfil del Edge de ICAM (no se sube al repositorio)
  puerto: 9222                    # puerto local por el que el programa usa ese Edge
  carpeta: "data/icam"            # un JSON por DIP leído
  vigencia_horas: 12              # un DIP leído hace más de esto se vuelve a leer
  tipos: ["Others"]               # tipos de DIP que se leen (extraer-icam --todos: todos)
  paralelo: 3                     # DIPs que se leen a la vez
  intentos: 3                     # reintentos por búsqueda o pestaña que falla
  espera_segundos: 30             # máximo por página
  espera_sesion_minutos: 10       # sin sesión, cuánto espera a que el usuario la inicie
  selector_busqueda: ""           # vacío = el campo Barcode Search se busca solo
  selector_contenido: "body"      # de dónde se copia el texto de cada pestaña
