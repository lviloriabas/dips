# Configuración general del auditor de DIPs.
# Las rutas relativas se resuelven desde la carpeta del proyecto.

referencias: "DIPs References.xlsx"
hoja_referencias: "References"
catalogo: "config/catalogo_others.yaml"
carpeta_salida: "salidas"

# Tipo de DIP que se audita (columna "Area" o "Type DIP" del Excel de entrada).
tipos_auditados: ["Others"]

tolerancias:
  dias: 1          # diferencia aceptada en días (redondeos de hora de apertura)
  meses_min: 30    # 1 mes = entre 30 y 31 días (+/- tolerancia de días)
  meses_max: 31

# Severidad asignada a cada tipo de hallazgo.
# Valores posibles: CRITICA, NO CRITICA, REVISAR, OBSERVACION
#   REVISAR:     el DIP queda en estado REVISAR (requiere confirmación humana).
#   OBSERVACION: se anota, pero no cambia el estado del DIP.
# Calibrado contra el histórico (jul-ago 2026). En el histórico, un intervalo
# MENOR al de referencia y la falta de S/N se aceptaron en la mayoría de los
# casos; por eso quedan como OBSERVACION. Cámbielo si el criterio es otro.
severidades:
  intervalo_excedido: CRITICA
  intervalo_menor: OBSERVACION
  intervalo_cero: NO CRITICA
  tipo_intervalo_incorrecto: CRITICA
  parent_assy_incorrecto: CRITICA
  due_date_posterior_a_intervalo: REVISAR
  due_date_anterior_a_intervalo: OBSERVACION
  due_date_posterior_a_vencimiento_item: CRITICA
  due_date_anterior_a_vencimiento_item: OBSERVACION
  dip_vencido: CRITICA
  completado_fuera_de_plazo: CRITICA
  usage_remaining_mayor_a_intervalo: NO CRITICA
  deferral_reference_ata: NO CRITICA
  ata_distinto_a_referencia: OBSERVACION
  tipo_dip_distinto_a_referencia: OBSERVACION
  sin_sn_en_descripcion: OBSERVACION
  sn_repetido: NO CRITICA
  duplicado: NO CRITICA
  fault_severity: OBSERVACION

# ---------------------------------------------------------------------------
# Modelo local (Ollama)
# ---------------------------------------------------------------------------
# Solo se usa para asociar a una referencia los DIPs que las reglas no asocian.
# Elige entre unas pocas referencias candidatas o responde NINGUNA; nunca decide
# si un DIP está OK o tiene discrepancia, y todo lo que sugiere queda en REVISAR.
# En "auditar" se activa con --llm; el benchmark siempre lo usa si está disponible.
#
# Para ajustar: cambie un valor, ejecute benchmark.bat y compare el resultado
# (aciertos, errores aceptados y segundos por consulta) con la línea base.
llm:
  url: "http://localhost:11434"
  modelo: "ministral-3:8b"   # otros probados: ministral-3:3b (menos RAM, algo menos preciso)
  timeout_segundos: 300      # por consulta; en CPU una consulta tarda entre 20 s y 1 min
  solo_cpu: false            # true = no usar GPU aunque exista (en PCs sin GPU no cambia nada)

  # Qué se le pregunta al modelo. Probado en el benchmark (23-09-2026, CPU i7-1265U):
  # con 4 candidatos y sin justificación cada consulta tarda 24 s en vez de 41 s,
  # pero el modelo resolvió bien 41 de 46 casos en vez de 44. Cada cambio por
  # separado perdió 1 caso. Como el modelo se consulta pocas veces al día, se
  # prefieren los aciertos.
  candidatos: 6              # referencias candidatas que se le muestran (más = prompt más largo)
  justificacion: true        # pedir una justificación corta, que se muestra al auditor
  pensar: false              # modo "thinking" (solo algunos modelos): mucho más lento

  # Cómo responde
  temperatura: 0             # 0 = siempre la misma respuesta para la misma pregunta
  contexto_tokens: 2048      # tamaño del contexto; el prompt usa unos 500 tokens
  max_tokens_respuesta: 300  # corta respuestas demasiado largas

  # Validación de la sugerencia (determinista, se aplica después del modelo)
  # El intervalo del DIP debe ser al menos esta fracción del TA de la referencia
  # sugerida (p. ej. 7 días para un TA de 6 meses se descarta). Además, el
  # Fault Name debe compartir una palabra distintiva con la referencia.
  fraccion_minima_ta: 0.2
