# Tipos de discrepancia y reglas de la auditoría.
#
# Guía paso a paso: docs/configurar_reglas.md
# Cada regla se escribe como codigo: SEVERIDAD. Todas están activas por defecto.
# Para desactivar una regla: codigo: {activa: false, severidad: SEVERIDAD}
# Para desactivar un tipo completo: agregue activo: false antes de reglas:.
# La severidad determina qué pasa con el DIP cuando la regla falla:
#     CRITICA, NO CRITICA, REVISAR -> POSIBLE DISCREPANCIA
#     CONSULTAR MANUAL             -> REVISAR: la tabla da el TA o el RIR según el daño o el
#                                     tipo ("DEPENDING ON...", "CONSULT REF."); ir al manual
#     SIN FUENTE                   -> SIN FUENTE: no hay referencia en la tabla con qué auditarlo
#     OBSERVACION                  -> se anota en HALLAZGOS, pero no cambia el resultado del DIP
#
# El resultado es OK, REVISAR, SIN FUENTE o POSIBLE DISCREPANCIA: los niveles (crítica / no crítica)
# y los tipos de discrepancia todavía no coinciden con el proceso de los auditores, y no se
# muestran. CRITICA, NO CRITICA y REVISAR se conservan para volver a separar niveles cuando
# se definan; hoy solo ordenan los hallazgos.
#
# Para revisar solo algunos tipos en una ejecución, sin cambiar este archivo:
#   auditar.bat "entrada.xlsx" --categorias "Incorrect DIP Interval" RIR
#   auditar.bat "entrada.xlsx" --excluir-categorias "Missing S/N"
# (python -m dips_audit categorias muestra los nombres).
#
# El resultado de un DIP es el de su hallazgo más grave. Una regla desactivada no aparece
# en HALLAZGOS ni en la hoja Hallazgos. Después de cambiar algo, ejecute
# .venv\Scripts\python -m dips_audit validar-reglas y luego el benchmark.
#
# Calibrado contra el histórico (jul-ago 2026) y la auditoría manual del 23-sep-2026. En el
# histórico, un intervalo MENOR al de referencia y la falta de S/N se aceptaron en la mayoría
# de los casos; por eso quedan como OBSERVACION. El 23-sep los auditores aceptaron todos los
# Usage Remaining mayores que el intervalo, los S/N removidos distintos de la descripción y
# las acciones correctivas sin cita del manual: también quedan como OBSERVACION. Las marcadas
# "a confirmar" se definen con los auditores.
#
# Revisado el 25-sep-2026 con los motivos que anotan los auditores en ICAM ("DIP DISCREPANCY
# FOUND: ..."), en las auditorías del 25-ago al 23-sep. Las auditorías más viejas dejaron pasar
# discrepancias (DIPs cerrados sin attachments, S/N con errores de escritura): no se usan para
# relajar una regla. Nuevas: sin attachments, Start del T/A (Incorrect DIP Start Values),
# referencia no específica (barcode de trabajo) y S/N distinto de las notas de la descripción.
#
# Criterios del 30-sep-2026: un duplicado (declarado, detectado o por S/N repetido) no es
# discrepancia, el cierre sin acción correctiva tampoco y el ATA del DIP no es relevante: los
# tres quedan como OBSERVACION. El intervalo excedido solo cuenta si el T/A de verdad vence
# después del TA; un Start posterior con eso descontado del intervalo es aceptable
# (dips_audit/reglas.py). Las auditorías de DIPs antiguos se hacían de otra forma: no sirven
# para medir el programa.

tipos:

  # --- Auditoría de apertura -------------------------------------------------

  Incorrect DIP Interval:
    reglas:
      intervalo_excedido:                CRITICA     # mayor que el TA de la referencia
      intervalo_menor:                   OBSERVACION # menor que el TA de la referencia
      intervalo_cero:                    NO CRITICA  # T/A con intervalo 0
      tipo_intervalo_incorrecto:         CRITICA     # días en vez de FH/FC, etc.
      variante_condicional:              OBSERVACION # coincide con una condición de la referencia (p. ej. PSI)
      usage_remaining_mayor_a_intervalo: OBSERVACION # T/A de scheduling distinto (Start posterior)
      limite_faltante:                   NO CRITICA  # la referencia pide dos límites (X o Y); el T/A en ICAM no los tiene
      intervalo_segun_manual:            CONSULTAR MANUAL # el TA depende del daño o del tipo ("DEPENDING ON...", "CONSULT SRM")
      # DIPs SIN FUENTE: contra el plazo que dice la descripción ("for 45 days or 225 FC").
      intervalo_mayor_a_descripcion:     CRITICA     # mayor que el plazo de la descripción
      tipo_intervalo_distinto_a_descripcion: CRITICA # en otra unidad que la descripción
      limite_declarado_faltante:         NO CRITICA  # la descripción pide varios límites; el T/A en ICAM no los tiene todos

  Deferral Interval Not Documented:
    reglas:
      datos_incompletos:                 REVISAR     # sin intervalo o tipo de intervalo (en SIN FUENTE: sin T/A ni RIR)

  Missing Data:
    reglas:
      intervalo_de_icam:                 OBSERVACION # el Excel no trae intervalo; se usó el de ICAM

  # Start del T/A en ICAM: en la apertura (en días, entre el hallazgo y el Defer Date; en FH
  # y FC, el uso al encontrar la falla). Con ventana "AFTER A, BEFORE B" en el catálogo
  # (amortiguador, FDR, frenos, filtro de combustible): A después de la apertura, con B - A.
  Incorrect DIP Start Values:
    reglas:
      inicio_ta_incorrecto:              NO CRITICA  # Start distinto de la apertura (o de apertura + A)

  Incorrect Due Date:
    reglas:
      # Desde el Start del T/A en ICAM (sin ICAM, desde la apertura). No aplica a ítems UNTIL DUE DATE.
      due_date_posterior_a_intervalo:        REVISAR     # due > inicio + intervalo
      due_date_anterior_a_intervalo:         OBSERVACION # due < inicio + intervalo
      due_date_posterior_a_vencimiento_item: CRITICA     # due después del vencimiento del ítem
      due_date_anterior_a_vencimiento_item:  OBSERVACION # due antes del vencimiento del ítem
      # En generators de oxígeno, el vencimiento del ítem es el Exp. Date del PDF de inventario adjunto.

  Overdue DIP:
    reglas:
      dip_vencido:                       CRITICA     # DIP activo con due date vencido
      programado_despues_del_due:        REVISAR     # paquete de trabajo (Scheduled Date) después del due date

  Incorrect Parent Assembly:
    reglas:
      # Si la referencia admite AIRCRAFT y ENGINE (se transfiere al robar el motor), el
      # hallazgo queda siempre como OBSERVACION.
      parent_assy_incorrecto:            CRITICA
      parent_assy_distinto_a_pares:      REVISAR     # SIN FUENTE: los demás DIPs con la misma EC/AMM están en otro

  # El ATA cargado en el DIP no es relevante para la auditoría: solo observación.
  Incorrect ATA:
    reglas:
      deferral_reference_ata:            OBSERVACION # Deferral Reference distinto del ATA
      ata_distinto_a_referencia:         OBSERVACION # ATA distinto al de la referencia

  Missing S/N:
    reglas:
      sin_sn_en_descripcion:             OBSERVACION # la referencia pide S/N y no está

  Incorrect S/N:
    reglas:
      sn_repetido:                       OBSERVACION # mismo S/N en otro DIP activo del avión (señal de duplicado)
      sn_inconsistente:                  NO CRITICA  # S/N del DIP distinto del de las notas de la descripción
      cierre_sn_distinto:                OBSERVACION # cierre: S/N removido distinto del de la descripción
      sn_fuera_de_inventario:            NO CRITICA  # generators: S/N del DIP que no está en el PDF de inventario

  # Un duplicado es un duplicado, no una discrepancia: se anota como observación.
  Duplicated DIP:
    reglas:
      duplicado:                         OBSERVACION # mismo avión, componente y abiertos a la vez
      # El técnico lo marcó como duplicado o creado por error.
      duplicado_declarado:               OBSERVACION # "DUPLICATED", "ENTERED BY MISTAKE"

  Incorrect Fault Severity:
    reglas:
      fault_severity:                    OBSERVACION # Fault Severity distinto de DIP

  # Solo para DIPs diferidos antes del 9-jul-2026. Apertura: sirve la referencia cargada
  # en ICAM (Technical References), una captura
  # adjunta o la cita en la descripción, como la acepta el auditor (calibrado con la
  # auditoría del 23-sep-2026). Sin datos de ICAM no se marca: queda para verificar.
  # Cierre: sin acción correctiva no es discrepancia (en ICAM queda vacía si se cerró por la
  # validación de QC o solo con partes): observación. Si la acción no cita el manual (salvo que
  # remita a otra tarea o que el DIP se haya cerrado sin trabajo: abierto por error, ya hecho,
  # sin acción) también queda como observación: el 23-sep los auditores la aceptaron.
  # El MGM no es referencia técnica. AMM, SRM y task card no necesitan revisión ni fecha
  # (referencia_tecnica.revision_opcional en config.yaml).
  Missing Technical Reference:
    reglas:
      sin_referencia_tecnica:            NO CRITICA  # sin referencia cargada, sin captura y sin cita
      referencia_tecnica_incompleta:     OBSERVACION # la cita sin revisión o sin fecha (el auditor no la marca)
      cierre_sin_accion_correctiva:      OBSERVACION # cierre: sin acción correctiva en ICAM
      cierre_sin_referencia_tecnica:     OBSERVACION # cierre: la acción correctiva no cita el manual
      cierre_referencia_incompleta:      OBSERVACION # cierre: la cita sin revisión o sin fecha

  # Un barcode de trabajo citado como fuente ("IAW BARCODE: TRF7N..., STEP 63") sin referencia
  # del manual. La task card JIC del Service Visit (B737-05-1-0001-U-JIC STEP 3) sí se acepta.
  Non-Specific Technical Reference:
    reglas:
      referencia_tecnica_no_especifica:  NO CRITICA

  # Solo si la tabla de referencias tiene el número de tarea.
  Incorrect Technical Reference:
    reglas:
      referencia_tecnica_equivocada:     NO CRITICA  # tiene la de otra referencia de la tabla
      # Posible discrepancia si la tabla pide una EC/ECRA y el DIP no la cita (cita la AMM:
      # descontaminación hidráulica) o si el DIP solo cita una task card JIC. Si cita la ECRA
      # que lo originó y la tabla da la AMM del procedimiento (lavado de motor), observación.
      referencia_tecnica_distinta:       REVISAR     # tiene una tarea que la tabla no tiene
      referencia_tecnica_mismo_tema:     OBSERVACION # otra tarea del mismo capítulo-sección-tema (el auditor la acepta)

  # RIR en Follow-on Tasks (datos de ICAM o columnas Rir del Excel). A confirmar.
  RIR:
    reglas:
      rir_restante_inverosimil:          NO CRITICA  # remanente del RIR claramente fuera de rango
      rir_faltante:                      NO CRITICA  # la referencia pide RIR y el DIP no tiene
      rir_intervalo_incorrecto:          NO CRITICA  # intervalo distinto del de la referencia
      rir_intervalo_menor:               OBSERVACION # más seguido que la referencia (más conservador)
      rir_limite_faltante:               NO CRITICA  # el T/A tiene un límite que el RIR no tiene
      rir_inicio_distinto:               REVISAR     # el RIR no empieza donde empieza el T/A
      rir_parent_distinto:               NO CRITICA  # RIR en otro Parent Assembly (avión / motor)
      rir_segun_manual:                  CONSULTAR MANUAL # el RIR depende del daño o de la medición ("7 DAYS OR 1 DAY, DEPENDING...")
      rir_descripcion_faltante:          NO CRITICA  # SIN FUENTE: la descripción pide inspección repetitiva y no hay RIR
      rir_descripcion_distinto:          NO CRITICA  # SIN FUENTE: RIR con otro intervalo (o sin un límite) que la descripción

  # --- Auditoría de cierre (DIP COMPLETE). A confirmar. ------------------------

  # Cerrado tarde = Usage Remaining negativo al cerrar (sin ese dato, la hora de cierre contra
  # el due date). Si el trabajo se hizo en otra tarea, queda para verificar en esa tarea.
  Late Completion:
    reglas:
      completado_fuera_de_plazo:         CRITICA     # cerrado después del due date
      cierre_deadline_extendido:         REVISAR     # después del due original, con extensión

  # Para DIPs diferidos antes del 9-jul-2026 se exigen attachments. Se cuentan en ICAM y,
  # sin ICAM, en el Excel (Attach Docs, Attachment Status PENDING = ninguno).
  Missing Attachment:
    reglas:
      sin_adjuntos:                      NO CRITICA  # apertura: sin attachments
      cierre_sin_adjuntos:               NO CRITICA  # cierre: sin attachments
      adjunto_otro_avion:                OBSERVACION # el nombre del attachment tiene otra matrícula
      sin_inventario_generadores:        OBSERVACION # generators: sin el PDF de inventario (con ICAM)

  # --- Asociación del DIP a su referencia --------------------------------------
  # Si se desactivan, un DIP asociado por aproximación puede quedar OK sin que nadie lo revise.

  Reference Match:
    reglas:
      asociacion_aproximada:             OBSERVACION # Fault Name con errores de escritura
      asociacion_por_referencia_tecnica: OBSERVACION # el nombre no alcanza; se usó la ref. técnica
      asociacion_por_descripcion:        OBSERVACION # el nombre no alcanza; se usó la descripción
      asociacion_por_tabla:              OBSERVACION # fila de la tabla sin entrada en el catálogo

  # SIN FUENTE: ni el Fault Name, ni la referencia técnica, ni la descripción corresponden a
  # una referencia de la tabla. Con REVISAR volvería a ser POSIBLE DISCREPANCIA.
  Missing Reference in Table:
    reglas:
      sin_referencia:                    SIN FUENTE  # no está en la tabla o coincide con varias

  Incorrect DIP Type:
    reglas:
      tipo_dip_distinto_a_referencia:    OBSERVACION # parece una referencia de otro tipo de DIP
